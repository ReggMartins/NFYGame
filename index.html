<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css\style.css">
    <title>Meu Portal de Jogos</title>
    

</head>
<body>

    <h1>Aventura Espacial</h1>

    <div class="layout-grid">
        
        <!-- 1. ANÚNCIO DO TOPO -->
        <div class="ad-container ad-top">
            <!-- Cole o código <script> do AdSense ou da plataforma aqui -->
            Anúncio Topo<br>(728 x 90)
        </div>

        <!-- 2. ANÚNCIO LATERAL ESQUERDA -->
        <div class="ad-container ad-left">
            Anúncio Esquerda<br>(160 x 600)
        </div>

        <!-- 3. O JOGO AO CENTRO -->
        <div class="game-container">
            
            <iframe src="https://play.gamepix.com/strike-galaxy-attack/embed?sid=911Y9" width="800" height="600" frameborder="0" scrolling="no" allowfullscreen="true" > </iframe>
            
            <center>
                <button id="btnTelaCheia" onclick="abrirTelaCheia()">🔲 Jogar em Tela Cheia</button>
            </center>

        </div>

        <!-- 4. ANÚNCIO LATERAL DIREITA -->
        <div class="ad-container ad-right">
            Anúncio Direita<br>(160 x 600)
        </div>

        <!-- 5. ANÚNCIO DO FUNDO -->
        <div class="ad-container ad-bottom">
            Anúncio Fundo<br>(728 x 90)
        </div>

    </div>


<script>
    function abrirTelaCheia() {
        // Seleciona o iframe do jogo
        var jogo = document.querySelector("iframe");

        // Tenta abrir em tela cheia lidando com os diferentes navegadores
        if (jogo.requestFullscreen) {
            jogo.requestFullscreen(); // Padrão moderno
        } else if (jogo.webkitRequestFullscreen) { 
            jogo.webkitRequestFullscreen(); // Safari e Chrome antigos
        } else if (jogo.msRequestFullscreen) { 
            jogo.msRequestFullscreen(); // Internet Explorer/Edge antigos
        }
    }
</script>

</body>
</html>
