<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css\style.css">
    <title>Meu Portal de Jogos</title>
    

</head>
<body>

    <h1>Aventura Espacial</h1>

    <div class="layout-grid">
        
        <!-- 1. ANÚNCIO DO TOPO -->
        <div class="ad-container ad-top">
            <!-- Cole o código <script> do AdSense ou da plataforma aqui -->
            Anúncio Topo<br>(728 x 90)
        </div>

        <!-- 2. ANÚNCIO LATERAL ESQUERDA -->
        <div class="ad-container ad-left">
            Anúncio Esquerda<br>(160 x 600)
        </div>

        <!-- 3. O JOGO AO CENTRO -->
        <div class="game-container">
            <iframe src="https://html5.gamedistribution.com/ce1b2e5eabe44debb11bf77cd04c0f85/?gd_sdk_referrer_url=https://www.example.com/games/{game-path}" width="800" height="600" scrolling="none" frameborder="0"> scrolling="none" allowfullscreen></iframe>
        </div>

        <!-- 4. ANÚNCIO LATERAL DIREITA -->
        <div class="ad-container ad-right">
            Anúncio Direita<br>(160 x 600)
        </div>

        <!-- 5. ANÚNCIO DO FUNDO -->
        <div class="ad-container ad-bottom">
            Anúncio Fundo<br>(728 x 90)
        </div>

    </div>

</body>
</html>
